# Netlify — impostare "Base directory" = 2026-10-02-Landing-Nutrizionista-Gamberini
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Sorgente degli articoli (WordPress headless)
  WP_API = "https://www.nutrizionistanicologamberini.it/wp-json/wp/v2"
  # Sito di prova: NON indicizzare (evita contenuti duplicati col sito WordPress attuale).
  # In produzione, sul dominio definitivo, impostare ALLOW_INDEXING = "true" dalla UI di Netlify.
  ALLOW_INDEXING = "false"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
